- name: Run nginx using docker (AWX safe)
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Update apt
      apt:
        update_cache: yes

    - name: Install docker
      apt:
        name: docker.io
        state: present

    - name: Start docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Remove existing nginx container (if any)
      shell: docker rm -f nginx || true

    - name: Run nginx container
      shell: docker run -d --name nginx -p 80:80 nginx
